<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-card: #161616;
  --bg-hover: #1e1e1e;
  --accent: #e50914;
  --accent-hover: #ff1a25;
  --text-primary: #ffffff;
  --text-secondary: #8a8a8a;
  --border: #2a2a2a;
  --border-light: #333333;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(10, 10, 10, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 50px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
}

.nav-logo .red { color: var(--accent); }
.nav-logo .white { color: white; }

.nav-links {
  display: flex;
  gap: 30px;
  align-items: center;
}

.nav-link {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.3s;
  cursor: pointer;
}

.nav-link:hover, .nav-link.active {
  color: var(--accent);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.btn-logout {
  padding: 8px 20px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-primary);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
}

.btn-logout:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* MAIN */
.page-content {
  padding-top: 70px;
  min-height: 100vh;
}

.section {
  padding: 60px 50px;
  max-width: 1400px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 50px;
}

.section-label {
  display: inline-block;
  padding: 6px 16px;
  background: rgba(229, 9, 20, 0.15);
  border: 1px solid rgba(229, 9, 20, 0.3);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-radius: 4px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 44px;
  font-weight: 900;
  margin-bottom: 12px;
  letter-spacing: -1px;
}

.section-title .red { color: var(--accent); }

.section-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
}

/* FILTER TABS */
.filter-tabs {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 50px;
}

.filter-tab {
  padding: 12px 24px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
}

.filter-tab:hover {
  border-color: var(--accent);
  background: var(--bg-hover);
}

.filter-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.filter-tab .brand-icon {
  font-size: 16px;
  font-weight: 800;
}

/* COMPARE SELECTORS */
.compare-selectors {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 50px;
}

.compare-selector {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  transition: all 0.3s;
}

.compare-selector:hover {
  border-color: var(--accent);
}

.compare-selector label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.compare-selector select {
  width: 100%;
  padding: 14px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}

.compare-selector select:focus {
  border-color: var(--accent);
}

.compare-selector select option {
  background: var(--bg-primary);
}

/* COMPARISON TABLE */
.compare-wrapper {
  overflow-x: auto;
  margin-bottom: 40px;
}

.compare-table {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  min-width: 700px;
}

.compare-header {
  display: grid;
  grid-template-columns: 200px 1fr 1fr;
  background: var(--bg-secondary);
  border-bottom: 2px solid var(--border);
}

.compare-header-cell {
  padding: 24px;
  text-align: center;
}

.compare-header-cell:first-child {
  text-align: left;
  font-weight: 800;
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
}

.compare-header-cell img {
  width: 100%;
  max-width: 220px;
  height: 140px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}

.compare-header-cell .car-name-label {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.compare-header-cell .car-brand-small {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.compare-row {
  display: grid;
  grid-template-columns: 200px 1fr 1fr;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}

.compare-row:hover {
  background: var(--bg-hover);
}

.compare-row:last-child { border-bottom: none; }

.compare-row.important {
  background: rgba(229, 9, 20, 0.05);
}

.compare-row.important:hover {
  background: rgba(229, 9, 20, 0.1);
}

.compare-cell {
  padding: 18px 24px;
  font-size: 15px;
  display: flex;
  align-items: center;
}

.compare-cell:first-child {
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.compare-cell:not(:first-child) {
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
}

.compare-cell.winner {
  color: var(--accent);
  position: relative;
}

.compare-cell.winner::after {
  content: '★';
  margin-left: 6px;
  font-size: 14px;
  color: var(--accent);
}

.compare-cell .spec-icon {
  font-size: 16px;
}

/* ACTIONS */
.compare-actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.page-content{
    background: linear-gradient(
        rgba(0, 255, 255, 0.534),
        rgb(0, 0, 0)
    );
}
.btn-primary {
  padding: 14px 32px;
  border-radius: 6px;
  background: var(--accent);
  color: white;
  font-weight: 700;
  font-size: 15px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
  font-family: inherit;
}

.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(229, 9, 20, 0.4);
}

.btn-secondary {
  padding: 14px 32px;
  border-radius: 6px;
  background: transparent;
  color: var(--text-primary);
  font-weight: 600;
  font-size: 15px;
  border: 1px solid var(--border);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
  font-family: inherit;
}

.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-secondary);
}

.empty-state-icon {
  font-size: 64px;
  margin-bottom: 20px;
  opacity: 0.4;
}

.empty-state h3 {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 10px;
  color: var(--text-primary);
}

.empty-state p { font-size: 15px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 30px; right: 30px;
  padding: 16px 28px;
  border-radius: 6px;
  background: var(--bg-card);
  border: 1px solid var(--accent);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  z-index: 3000;
  display: none;
  align-items: center;
  gap: 10px;
  animation: slideIn 0.3s ease;
  box-shadow: 0 8px 24px rgba(229, 9, 20, 0.3);
}

.toast.show { display: flex; }

@keyframes slideIn {
  from { transform: translateX(100px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* FOOTER */
.footer {
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  padding: 30px 50px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
  margin-top: 60px;
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .navbar { padding: 0 24px; }
  .section { padding: 40px 24px; }
  .section-title { font-size: 32px; }
  .compare-selectors { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .nav-links { display: none; }
  .section-title { font-size: 26px; }
  .filter-tabs { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 10px; }
  .filter-tab { flex-shrink: 0; }
}

header {

}

nav {

}
.hero {
    content: '';

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

        linear-gradient(90deg, rgba(10, 247, 196, 0) 1px, transparent 1px);

    pointer-events: none;
}
nav a {
    color: #b8c0c9;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;

    transition: 0.3s;
}

nav a:hover {
    color: white;
}

nav a.active {
    color: #ff101c;
}


/* MAIN */

main {
    min-height: 700px;
}
</style>
</head>

let currentFilter = 'all';

// ============ SELECTLARNI TO'LDIRISH ============
function populateSelects() {
  const filtered = currentFilter === 'all' ? cars : cars.filter(c => c.brand === currentFilter);
  const options = filtered.map(c => 
    `<option value="${c.id}">${c.brand} ${c.name} — $${c.price.toLocaleString()}</option>`
  ).join('');
  
  ['compare1', 'compare2', 'compare3'].forEach(id => {
    const sel = document.getElementById(id);
    const currentVal = sel.value;
    sel.innerHTML = '<option value="">— Tanlang —</option>' + options;
    sel.value = currentVal;
  });
}

// ============ FILTER ============
function setFilter(brand, btn) {
  currentFilter = brand;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  
  // Reset selections
  ['compare1', 'compare2', 'compare3'].forEach(id => {
    document.getElementById(id).value = '';
  });
  
  populateSelects();
  updateComparison();
}

// ============ SOLISHTIRISH ============
function updateComparison() {
  const ids = ['compare1', 'compare2', 'compare3']
    .map(id => document.getElementById(id).value)
    .filter(Boolean)
    .map(Number);

  const table = document.getElementById('compareTable');

  if (ids.length < 2) {
    table.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚖️</div>
        <h3>Avtomobil tanlang</h3>
        <p>Solishtirish uchun kamida 2 ta avtomobil tanlang</p>
      </div>`;
    return;
  }

  const selected = ids.map(id => cars.find(c => c.id === id));
  const cols = selected.length + 1;

  const specs = [
    { label: 'Narx', key: 'price', icon: '💰', format: v => '$' + v.toLocaleString(), lower: true, important: true },
    { label: 'Yil', key: 'year', icon: '📅', format: v => v + ' yil', lower: false },
    { label: 'Yoqilg\'i', key: 'fuel', icon: '⛽', format: v => v, lower: false },
    { label: 'Max tezlik', key: 'speed', icon: '⚡', format: v => v + ' km/h', lower: false },
    { label: 'Quvvat', key: 'power', icon: '🐎', format: v => v + ' HP', lower: false },
    { label: '0-100 km/h', key: 'acceleration', icon: '️', format: v => v + ' s', lower: true, important: true },
    { label: 'Yurish masofasi', key: 'range', icon: '🛣️', format: v => v + ' km', lower: false, important: true },
    { label: 'Batareya', key: 'battery', icon: '', format: v => v > 0 ? v + ' kWh' : '—', lower: false },
    { label: 'Zaryadka', key: 'charge', icon: '🔌', format: v => v > 0 ? v + ' min' : '—', lower: true },
    { label: 'O\'rinlar', key: 'seats', icon: '💺', format: v => v + ' kishi', lower: false },
    { label: 'Og\'irlik', key: 'weight', icon: '⚖️', format: v => v + ' kg', lower: true },
    { label: 'Yukxona', key: 'trunk', icon: '📦', format: v => v + ' L', lower: false },
    { label: 'Kafolat', key: 'warranty', icon: '🛡️', format: v => v, lower: false },
    { label: 'Transmissiya', key: 'transmission', icon: '⚙️', format: v => v, lower: false }
  ];

  let html = `<div class="compare-header" style="grid-template-columns: 200px repeat(${selected.length}, 1fr);">
    <div class="compare-header-cell">XUSUSIYAT</div>
    ${selected.map(c => `
      <div class="compare-header-cell">
        <img src="${c.image}" alt="${c.name}">
        <div class="car-name-label">${c.name}</div>
        <div class="car-brand-small">${c.brand}</div>
      </div>
    `).join('')}
  </div>`;

  specs.forEach(spec => {
    const values = selected.map(c => c[spec.key]);
    let bestIdx = -1;
    
    const numericValues = values.filter(v => typeof v === 'number');
    if (numericValues.length > 1) {
      if (spec.lower) {
        bestIdx = values.indexOf(Math.min(...numericValues));
      } else {
        bestIdx = values.indexOf(Math.max(...numericValues));
      }
    }

    html += `<div class="compare-row ${spec.important ? 'important' : ''}" style="grid-template-columns: 200px repeat(${selected.length}, 1fr);">
      <div class="compare-cell">
        <span class="spec-icon">${spec.icon}</span>
        ${spec.label}
      </div>
      ${selected.map((c, i) => `
        <div class="compare-cell ${i === bestIdx && numericValues.length > 1 ? 'winner' : ''}">
          ${spec.format(c[spec.key])}
        </div>
      `).join('')}
    </div>`;
  });

  table.innerHTML = html;
}

// ============ TOZALASH ============
function resetComparison() {
  ['compare1', 'compare2', 'compare3'].forEach(id => {
    document.getElementById(id).value = '';
  });
  updateComparison();
  showToast('🔄 Solishtirish tozalandi');
}

// ============ ULASHISH ============
function shareComparison() {
  const ids = ['compare1', 'compare2', 'compare3']
    .map(id => document.getElementById(id).value)
    .filter(Boolean);

  if (ids.length < 2) {
    showToast('⚠️ Kamida 2 ta avtomobil tanlang!');
    return;
  }

  navigator.clipboard.writeText(window.location.href);
  showToast('📋 Havola nusxalandi!');
}

// ============ SOTIB OLISH ============
function buySelected() {
  const id = document.getElementById('compare1').value;
  if (!id) {
    showToast('⚠️ Avtomobil tanlang!');
    return;
  }
  const car = cars.find(c => c.id === Number(id));
  showToast(`✅ ${car.name} sotib olindi!`);
}

// ============ TOAST ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  populateSelects();
  
  // Demo uchun default qiymatlar
  setTimeout(() => {
    document.getElementById('compare1').value = '1';
    document.getElementById('compare2').value = '3';
    updateComparison();
  }, 300);
});
</script>
