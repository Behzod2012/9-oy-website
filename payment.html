<!-- Theme Switcher UI -->
<button class="theme-toggle" id="themeToggle" aria-label="Change theme">
  🎨
</button>

<div class="theme-panel" id="themePanel">
  <h4>Orqa Fon</h4>
  <button class="theme-option active" data-theme="dark">
    <span>🌑</span>
    <span>Qora (Dark)</span>
  </button>
  <button class="theme-option" data-theme="light">
    <span>☀️</span>
    <span>Oq (Light)</span>
  </button>
  <button class="theme-option" data-theme="stars">
    <span>⭐</span>
    <span>Yulduzli</span>
  </button>
  <button class="theme-option" data-theme="magic">
    <span>🔮</span>
    <span>Sehrli</span>
  </button>
  <button class="theme-option" data-theme="colorful">
    <span>🌈</span>
    <span>Rangli</span>
  </button>
</div>

<!-- Theme Controller JavaScript -->
<script>
  // Theme Switcher Logic
  const themeToggle = document.getElementById('themeToggle');
  const themePanel = document.getElementById('themePanel');
  const themeOptions = document.querySelectorAll('.theme-option');
  
  // Toggle panel visibility
  themeToggle.addEventListener('click', () => {
    themePanel.classList.toggle('show');
  });
  
  // Close panel when clicking outside
  document.addEventListener('click', (e) => {
    if (!themePanel.contains(e.target) && !themeToggle.contains(e.target)) {
      themePanel.classList.remove('show');
    }
  });
  
  // Handle theme changes
  themeOptions.forEach(option => {
    option.addEventListener('click', () => {
      const theme = option.getAttribute('data-theme');
      
      // Remove active class from all options
      themeOptions.forEach(opt => opt.classList.remove('active'));
      
      // Add active class to clicked option
      option.classList.add('active');
      
      // Apply theme
      if (theme === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', theme);
      }
      
      // Add shooting stars for starry theme
      if (theme === 'stars') {
        createShootingStars();
      } else {
        removeShootingStars();
      }
      
      // Save preference
      localStorage.setItem('preferred-theme', theme);
      
      // Close panel
      setTimeout(() => {
        themePanel.classList.remove('show');
      }, 300);
    });
  });
  
  // Create shooting stars effect
  function createShootingStars() {
    removeShootingStars();
    const starCount = 3;
    for (let i = 0; i < starCount; i++) {
      setTimeout(() => {
        const star = document.createElement('div');
        star.className = 'shooting-star';
        star.style.top = Math.random() * 50 + '%';
        star.style.left = Math.random() * 50 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        document.body.appendChild(star);
      }, i * 1000);
    }
  }
  
  function removeShootingStars() {
    document.querySelectorAll('.shooting-star').forEach(star => star.remove());
  }
  
  // Load saved theme on page load
  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('preferred-theme');
    if (savedTheme && savedTheme !== 'dark') {
      document.body.setAttribute('data-theme', savedTheme);
      const activeOption = document.querySelector(`[data-theme="${savedTheme}"]`);
      if (activeOption) {
        themeOptions.forEach(opt => opt.classList.remove('active'));
        activeOption.classList.add('active');
        if (savedTheme === 'stars') {
          createShootingStars();
        }
      }
    }
  });
</script>
<script src="js/script.js"></script>

</body>

</html>
